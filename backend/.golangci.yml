version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (*net/http.Response).Body.Close
        - (*os.File).Close
        - (io.Closer).Close
        - (*cloud.google.com/go/storage.Client).Close
        - (*cloud.google.com/go/storage.Reader).Close
        - (*cloud.google.com/go/recaptchaenterprise/v2/apiv1.Client).Close
        - os.Remove
        - os.RemoveAll
        - os.Setenv
        - os.Unsetenv
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - errcheck
